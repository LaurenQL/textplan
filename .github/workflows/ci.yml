name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # build 脚本已包含 tsc -noEmit，类型检查一并覆盖
      - name: Build plugin
        run: npm run build
